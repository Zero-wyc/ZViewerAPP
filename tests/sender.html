<!doctype html>
<html><body><canvas width="640" height="360"></canvas><script type="module">
import { io } from '/socket.io/socket.io.esm.min.js';
const socket = io();
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
let frame = 0;
setInterval(() => {
  ctx.fillStyle = '#24b878';
  ctx.fillRect(0, 0, 640, 360);
  ctx.fillStyle = '#f0cc55';
  ctx.fillRect((frame++ * 7) % 540, 90, 100, 100);
  ctx.fillStyle = 'white';
  ctx.font = '32px sans-serif';
  ctx.fillText('ZViewer screen receive test', 30, 300);
}, 50);
const stream = canvas.captureStream(20);
const peers = new Map();
const pending = new Map();
socket.on('connect', () => socket.emit('test-sender', () => document.title = 'Sender ready'));
socket.on('viewer-ready', async ({ viewerSocketId }) => {
  peers.get(viewerSocketId)?.close();
  const pc = new RTCPeerConnection();
  peers.set(viewerSocketId, pc);
  stream.getTracks().forEach(track => pc.addTrack(track, stream));
  pc.onicecandidate = event => {
    if (event.candidate) socket.emit('signal-ice-candidate', { to: viewerSocketId, data: event.candidate });
  };
  await pc.setLocalDescription(await pc.createOffer());
  socket.emit('signal-offer', { to: viewerSocketId, data: pc.localDescription });
});
socket.on('signal-answer', async ({ from, data }) => {
  const pc = peers.get(from);
  await pc.setRemoteDescription(data);
  for (const candidate of pending.get(from) || []) await pc.addIceCandidate(candidate);
  pending.delete(from);
});
socket.on('signal-ice-candidate', async ({ from, data }) => {
  const pc = peers.get(from);
  if (pc?.remoteDescription) await pc.addIceCandidate(data);
  else pending.set(from, [...(pending.get(from) || []), data]);
});
</script></body></html>
