server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 允许大文件上传（默认 1MB 不够用）
    client_max_body_size 10G;

    # 前端静态资源（SPA 入口）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 路由：/login /share /watch /direct-share /direct-watch
    location ~ ^/(login|share|watch|direct-share|direct-watch) {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 API 请求到后端
    location /api {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流媒体优化：禁用缓冲，让视频流数据即时传输到客户端
        proxy_buffering off;
        # 流媒体传输可能持续很长时间，增加超时避免中断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 反向代理上传文件（头像等）到后端静态文件服务
    location /uploads {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反向代理 Socket.IO 到后端，支持 WebSocket 长连接
    location /socket.io {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
